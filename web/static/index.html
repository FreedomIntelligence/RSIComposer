<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#faf9f5" />
  <title>RSISys</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/style.css" />
  <script src="/i18n.js" defer></script>
  <script src="/decisions.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="跳至内容">跳至内容</a>
  <header class="masthead">
    <a class="wordmark" href="/" aria-label="RSISys 首页" data-i18n-aria-label="RSISys 首页">RSISys<span>.</span></a>
    <div class="header-actions"><div class="language-switch" role="group" aria-label="界面语言" data-i18n-aria-label="界面语言"><button id="lang-zh" type="button" lang="zh-CN" aria-pressed="true">中</button><button id="lang-en" type="button" lang="en" aria-pressed="false">EN</button></div></div>
  </header>
  <div class="workspace-shell">
    <main id="main">
      <div id="notice" class="notice" role="status" hidden></div>
      <section id="management" aria-labelledby="management-title">
        <div class="project-heading"><h1 id="management-title" data-i18n="项目管理">项目管理</h1><span id="experiment-count" class="quiet-note"></span></div>
        <div id="project-list" class="project-groups"></div>
      </section>
      <section id="projects" aria-labelledby="project-name" hidden>
        <button id="back-projects" class="back-link" data-i18n="← 项目管理">← 项目管理</button>
        <div class="project-heading"><div><h1 id="project-name"></h1><p id="project-description" hidden></p></div></div>
        <div id="project-content"></div>
      </section>
      <section id="empty" class="empty-state" hidden>
        <h1 id="empty-title">等待第一次运行</h1>
        <p id="empty-description">尚无运行快照。</p>
      </section>
    </main>
  </div>
  <span id="footer-source" hidden></span>
  <noscript><p class="notice" data-i18n="请启用 JavaScript 以读取监控状态。">请启用 JavaScript 以读取监控状态。</p></noscript>
</body>
</html>
