[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rsimonitor"
version = "0.1.0"
description = "Read-only experiment monitoring and research visualization"
readme = {text = "RSIMonitor is the optional read-only viewer for RSISys run directories. Install with pip install ./src/rsimonitor and launch rsimonitor --runs-dir runs. See https://github.com/satsuki2486441738/RSISys#monitor for usage and security boundaries.", content-type = "text/plain"}
requires-python = ">=3.12"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "RSISys contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/satsuki2486441738/RSISys"
Issues = "https://github.com/satsuki2486441738/RSISys/issues"

[project.scripts]
rsimonitor = "rsimonitor.server:main"

[tool.setuptools]
packages = ["rsimonitor"]
package-dir = {rsimonitor = "."}
include-package-data = false

[tool.setuptools.package-data]
rsimonitor = ["static/index.html", "static/style.css", "static/i18n.js", "static/decisions.js", "static/app.js"]
