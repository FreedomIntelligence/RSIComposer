[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rsimonitor"
version = "0.2.0"
description = "Read-only experiment monitoring and research visualization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "RSIComposer contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/FreedomIntelligence/RSIComposer"
Documentation = "https://github.com/FreedomIntelligence/RSIComposer/blob/main/src/rsimonitor/README.md"
Issues = "https://github.com/FreedomIntelligence/RSIComposer/issues"

[project.scripts]
rsimonitor = "rsimonitor.server:main"

[tool.setuptools]
packages = ["rsimonitor"]
package-dir = {rsimonitor = "."}
include-package-data = false

[tool.setuptools.package-data]
rsimonitor = ["monitor_contract.json", "static/index.html", "static/lucide.min.js",
              "static/app/*.js", "static/app/*.css"]
