<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f5">
  <title>RSImonitor · 实验工作台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/board.css">
  <script src="/lucide.min.js" defer></script>
  <script src="/live.js" defer></script>
  <script src="/board.js" defer></script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#overview" aria-label="RSISys Monitor 首页"><span class="wordmark">RSISys<span>.</span></span><span class="brand-light">Monitor</span></a>
    <div class="workspace-label"><span class="workspace-avatar">R</span><div><strong>RSISys Research</strong><small>经典 RSI 实验空间</small></div><i data-lucide="chevrons-up-down"></i></div>
    <div class="nav-label">工作空间</div>
    <nav aria-label="工作空间">
      <a href="#experiments" data-nav="experiments"><i data-lucide="layers-2"></i>实验管理<span class="nav-count" data-live-run-count>0</span></a>
      <a href="#compare" data-nav="compare"><i data-lucide="git-compare-arrows"></i>实验对比</a>
    </nav>
    <div class="nav-label active-run-label">当前实验<span class="tiny-dot"></span></div>
    <button class="run-switch" id="run-switch"><span class="run-color"></span><span id="sidebar-run">等待实验</span><i data-lucide="chevron-down"></i></button>
    <nav aria-label="实验视图" id="run-nav">
      <a href="#overview" data-nav="overview"><i data-lucide="layout-dashboard"></i>运行总览</a>
      <a href="#trajectory" data-nav="trajectory"><i data-lucide="route"></i>执行轨迹<span class="nav-count" data-live-stage-count>0</span></a>
      <a href="#metrics" data-nav="metrics"><i data-lucide="chart-no-axes-combined"></i>指标分析</a>
      <a href="#samples" data-nav="samples"><i data-lucide="list-checks"></i>评测样本</a>
      <a href="#artifacts" data-nav="artifacts"><i data-lucide="git-branch"></i>版本与产物</a>
      <a href="#resources" data-nav="resources"><i data-lucide="cpu"></i>资源与成本</a>
      <a href="#logs" data-nav="logs"><i data-lucide="terminal"></i>日志与配置</a>
    </nav>
    <a class="legacy-link" href="/legacy">旧版项目视图</a>
    <div class="sidebar-bottom"><span class="connection-dot"></span><span id="source-label">实时监控</span><span class="version">v0.2</span></div>
  </aside>
  <div class="app-shell">
    <header class="topbar">
      <div class="breadcrumb"><button class="icon-button mobile-menu" id="menu-toggle" title="展开导航" aria-label="展开导航"><i data-lucide="menu"></i></button><span>经典 RSI</span><i data-lucide="chevron-right"></i><span id="breadcrumb-page">运行总览</span></div>
      <div class="top-actions"><span class="demo-badge"><span></span><span id="source-mode">真实运行</span></span><button class="icon-button" id="refresh-button" title="立即同步" aria-label="立即同步"><i data-lucide="rotate-cw"></i></button><button class="avatar" id="workspace-info" title="工作空间信息">RS</button></div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="page-footer"><span>RSImonitor <span class="footer-dot">·</span> RSISys-lijie</span><span id="source-footer">本地只读快照</span></footer>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <dialog id="detail-dialog"><div class="dialog-header"><div><span class="eyebrow" id="dialog-eyebrow">详情</span><h2 id="dialog-title"></h2></div><button class="icon-button" id="dialog-close" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><div id="dialog-body"></div></dialog>
</body>
</html>
