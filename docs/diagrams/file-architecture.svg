<title id="title">RSISys：决策器与 Labs 代码映射</title>
<desc id="desc">Registry 注册决策器与 Labs；meta-agent 的 agent_memory.py 提供可选显式记忆和任务窗口。反馈设施保留归档与显式兼容处理器；默认没有独立整理 agent。</desc>
