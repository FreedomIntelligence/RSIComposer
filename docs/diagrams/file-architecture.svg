<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1530" viewBox="0 0 1800 1530" role="img" aria-labelledby="title desc">
<title id="title">RSISys：统一角色与代码映射</title>
<desc id="desc">以 meta-agent（decision侧）、Lab、meta-agent（整理侧）映射当前文件。最小公开窗口只规定模块基本职能，不规定内部算法、存储或 Actor 结构。统一装配与 Host 管理生命周期；状态适配器提供原目录恢复；看板只面向人。decision_maker、exploration、feedback_learning 保留为兼容实现标识。</desc>
