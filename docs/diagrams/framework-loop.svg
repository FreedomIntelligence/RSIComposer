<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">RSISys controller and Labs</title>
  <desc id="desc">The controller chooses operations; Labs execute and return feedback. Host and Runner provide shared runtime services. Harness, memory, engines and verifiers are internal components.</desc>
  <rect width="1040" height="360" rx="16" fill="#f5f7fb"/>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="520" y="40" fill="#243447" font-size="23" font-weight="650">RSISys · controller → Lab → feedback</text>
    <rect x="50" y="73" width="350" height="164" rx="12" fill="#e9f1ff" stroke="#547cb7" stroke-width="1.5"/>
    <text x="225" y="111" fill="#233e67" font-size="22" font-weight="650">RSI controller</text>
    <text x="225" y="143" fill="#334b69" font-size="16">decide(input) → decision</text>
    <text x="225" y="176" fill="#334b69" font-size="15">algorithm · harness · memory</text>
    <text x="225" y="207" fill="#334b69" font-size="15">candidate and strategy selection</text>
    <rect x="640" y="73" width="350" height="164" rx="12" fill="#e6f5f0" stroke="#4f8a79" stroke-width="1.5"/>
    <text x="815" y="111" fill="#255c4b" font-size="22" font-weight="650">Labs</text>
    <text x="815" y="143" fill="#335d50" font-size="16">describe() · execute(request)</text>
    <text x="815" y="176" fill="#335d50" font-size="15">data · engines · verifiers</text>
    <text x="815" y="207" fill="#335d50" font-size="15">execution and measurement</text>
    <path d="M 413 122 H 615" fill="none" stroke="#47627d" stroke-width="2"/>
    <path d="M 626 122 L 614 116 L 614 128 Z" fill="#47627d"/>
    <text x="520" y="108" fill="#3a516b" font-size="16">Lab request</text>
    <path d="M 626 199 H 424" fill="none" stroke="#47627d" stroke-width="2"/>
    <path d="M 413 199 L 425 193 L 425 205 Z" fill="#47627d"/>
    <text x="520" y="184" fill="#3a516b" font-size="16">feedback + evidence</text>
    <rect x="50" y="266" width="940" height="65" rx="10" fill="#fff" stroke="#bdc9d9"/>
    <text x="520" y="293" fill="#243447" font-size="18" font-weight="600">Host / Runner · shared runtime</text>
    <text x="520" y="317" fill="#51647b" font-size="15">registration · authorization · routing · receipts · lifecycle · owned cleanup</text>
  </g>
</svg>
