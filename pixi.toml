[workspace]
channels = ["conda-forge"]
name = "RSISys"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
monitor = { cmd = "python -m rsimonitor.server --runs-dir runs", env = { PYTHONPATH = "src" } }
backend-demo = { cmd = "python examples/components/backend_training.py", env = { PYTHONPATH = "src" } }
coordination-demo = { cmd = "python examples/components/coordination.py", env = { PYTHONPATH = "src" } }
local-demo = { cmd = "python -m rsisys run --config configs/local.json", env = { PYTHONPATH = "src" } }
loop-demo = { cmd = "python examples/components/loop_internals.py", env = { PYTHONPATH = "src" } }
demo = { cmd = "python -m rsisys demo --config configs/demo.json", env = { PYTHONPATH = "src" } }
test = { cmd = "python -m unittest discover -s tests -t . -v", env = { PYTHONPATH = "src" } }

[dependencies]
python = "3.12.*"
