name: Core verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU-only optional test dependency
        run: python -m pip install 'numpy>=2,<3'
      - name: Run keyless core and FunSearch regressions
        run: PYTHONPATH=src python -m unittest discover -s verification -v
      - name: Verify installed wheel outside the checkout
        run: |
          python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/wheels"
          python -m venv "$RUNNER_TEMP/rsicomposer-verify"
          "$RUNNER_TEMP/rsicomposer-verify/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/wheels/rsicomposer-*.whl
          "$RUNNER_TEMP/rsicomposer-verify/bin/python" -I verification/wheel_smoke.py
