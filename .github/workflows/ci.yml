name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build distributions and run CPU smoke checks
        run: |
          python -m pip install --quiet build
          python -m build --outdir dist .
          python -m build --wheel --outdir dist src/rsimonitor
          python -m pip install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          import sys
          import tarfile
          import tempfile
          from importlib.resources import files
          import rsisys.api as api

          for name in api.__all__:
              getattr(api, name)
          assert 'rest_em' in api.Registry().describe()['methods']
          assert files('rsimonitor').joinpath('static/app/monitor.js').is_file()
          archives = pathlib.Path(os.environ['GITHUB_WORKSPACE'], 'dist').glob('rsisys-*.tar.gz')
          with tarfile.open(next(archives)) as archive:
              assets = [member.name.split('/', 1)[-1] for member in archive.getmembers()
                        if member.isfile() and member.name.split('/', 1)[-1].startswith('assets/')]
              assert assets == ['assets/rsisys-overview.png'], assets
          with tempfile.TemporaryDirectory() as directory:
              root = pathlib.Path(directory)
              quickstart = files('rsisys.algorithms').joinpath('rest_em/configs/cpu/rest_em.json')
              result = subprocess.run(
                  [sys.executable, '-I', '-m', 'rsisys', 'run', '--config', str(quickstart),
                   '--data-dir', str(root / 'quickstart')],
                  cwd=root, capture_output=True, text=True, check=True)
              assert json.loads(result.stdout)['status'] == 'finished'
              assert (root / 'quickstart/result.json').is_file()
              plugin = root / 'method'
              shutil.copytree(files('rsisys.algorithms').joinpath('_template'), plugin)
              result = subprocess.run(
                  [sys.executable, '-I', '-m', 'rsisys', 'run', '--plugin', str(plugin),
                   '--config', str(plugin / 'configs/run.json'), '--data-dir', str(root / 'run')],
                  cwd=root, capture_output=True, text=True, check=True)
              assert json.loads(result.stdout)['status'] == 'finished'
              assert len(json.loads((root / 'run/monitor.json').read_text())['evaluations']) == 3
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/rsimonitor/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/rsimonitor/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Published assets match the frontend sources
        run: git diff --exit-code -- ../static/app
