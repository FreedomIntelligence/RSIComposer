name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -t . -q
        env:
          PYTHONPATH: src
      - run: node --test tests/monitor/frontend/*.test.js
      - run: ruff check --select E9,F63,F7,F82 src tests examples experiments tools
      - run: python tools/check_docs.py

  packages:
    name: Source and wheel packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
      - run: python -m build --outdir dist/core .
      - run: python -m build --outdir dist/monitor src/rsimonitor
      - run: python -m twine check --strict dist/core/* dist/monitor/*
      - run: >-
          python tools/smoke_wheels.py
          --core-wheel dist/core/rsisys-0.1.0-py3-none-any.whl
          --monitor-wheel dist/monitor/rsimonitor-0.1.0-py3-none-any.whl
          --core-sdist dist/core/rsisys-0.1.0.tar.gz
