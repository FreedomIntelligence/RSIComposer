name: Method or architecture proposal
description: Propose an algorithm adapter or shared runtime capability
body:
  - type: textarea
    id: problem
    attributes:
      label: Intended behavior and motivation
    validations:
      required: true
  - type: textarea
    id: integration
    attributes:
      label: Integration boundary
      description: Controller/Lab/component replacement, or a new core scheduling/recovery/resource semantic? Link the method and proposed validation.
    validations:
      required: true
