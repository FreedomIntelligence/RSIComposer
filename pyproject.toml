[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rsicomposer"
version = "0.1.0"
description = "Modular RSI framework with pluggable controllers and Lab execution environments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "RSIComposer contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/FreedomIntelligence/RSIComposer"
Documentation = "https://github.com/FreedomIntelligence/RSIComposer/blob/main/src/rsicomposer/README.md"
Issues = "https://github.com/FreedomIntelligence/RSIComposer/issues"

[project.scripts]
rsicomposer = "rsicomposer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rsicomposer", "rsicomposer.*"]

[project.optional-dependencies]
ray = ["ray[default]==2.47.1"]
langmem = ["langmem==0.0.30", "trustcall==0.0.39",
           "langgraph==1.2.22", "langchain-core==1.8.1", "langsmith==0.15.0"]
coding = ["harbor==0.26.0", "openai>=3.51,<4"]
math = ["math-verify[antlr4_13_2]==0.9.0"]
computer-use = ["playwright>=1.51,<2", "requests>=2.32,<3"]
search = ["openai>=3.51,<4", "pandas==2.3.1", "numpy==2.3.2", "pandarallel==1.6.5",
          "dateparser==1.2.2", "loguru==0.7.3", "datasets>=3,<6", "jinja2>=3.1,<4",
          "requests>=2.32,<3", "tenacity>=8,<10", "volcengine-ark-runtime>=5,<6"]
dsh = ["deepseek-harness-sdk==0.2.1rc2"]
dev = ["build>=1.2,<2", "twine>=6,<7", "ruff>=0.11,<1"]

[tool.setuptools.package-data]
"rsicomposer.harnesses.decision" = ["dsh.patch.yml"]
"rsicomposer.harnesses.decision.feedback" = ["prompts/*.txt"]
"rsicomposer.harnesses.decision.policy" = ["prompts/*.txt"]

"rsicomposer.algorithms" = ["*/configs/*.json", "*/configs/*.toml", "*/configs/cpu/*.json", "*/configs/cpu/data/*.jsonl", "*/task.txt"]

"rsicomposer.runtime.orchestration" = ["monitor_contract.json"]
"rsicomposer.labs.coding" = ["README.md"]
"rsicomposer.labs.math" = ["README.md"]
"rsicomposer.labs.computer_use" = ["README.md"]
"rsicomposer.labs.professional_work" = ["README.md"]
"rsicomposer.labs.search" = ["README.md"]
"rsicomposer.labs._template" = ["README.md", "configs/*.json", "data/*.jsonl"]
