[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsisys"
version = "0.1.0"
description = "Modular dual-loop RSI scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rsisys = "rsisys.cli:main"
rsisys-monitor = "rsisys.monitor.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dsh = ["deepseek-harness-sdk==0.2.1rc2"]
test = ["jsonschema>=4,<5"]

[tool.setuptools.package-data]
"rsisys.loops.decision_making.harness" = ["dsh.patch.yml"]
"rsisys.monitor" = ["static/index.html", "static/style.css", "static/i18n.js", "static/decisions.js", "static/app.js"]
